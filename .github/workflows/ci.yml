name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (none required)
        run: npm install --ignore-scripts || true

      - name: Validate components & integration
        run: node scripts/validate.mjs

      - name: Guard against accidental secrets
        run: |
          if grep -RInE '(api[_-]?key|secret|password|token)\s*[:=]\s*["\x27][^"\x27]{8,}' \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            --include='*.md' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null; then
            echo "::error::Possible secret pattern found"
            exit 1
          fi
          echo "No obvious secrets detected"

  release-notes:
    name: Release readiness
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm drop-in files present
        run: |
          test -f src/components/BookCoverView.jsx
          test -f src/components/BookCardWithWholeCover.jsx
          test -f patches/BookReader-integration.md
          test -f INSTALL.md
          echo "Release artifacts OK"
