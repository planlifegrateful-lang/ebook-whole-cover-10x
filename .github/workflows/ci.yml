name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: |
          ls -la
          ls -la scripts/ || true
          ls -la src/components/ || true
          node --version
      - name: Run validate
        run: node scripts/validate.mjs
